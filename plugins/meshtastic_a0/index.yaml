title: Meshtastic A0
description: >-
  Chat bridge and messaging between Agent Zero and a Meshtastic LoRa mesh node over the
  Meshtastic TCP API. Routes inbound mesh DMs into Agent Zero and replies back over the
  radio, plus agent tools to read nodes and send DMs or broadcasts. Reinstalls its Python
  dependencies on container start so the bridge survives image rebuilds.
github: https://github.com/AgentXenAI/a0-meshtastic
tags:
