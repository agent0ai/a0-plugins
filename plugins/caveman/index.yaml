title: Caveman (compressed replies)
description: >-
  Squeezes the assistant's own wording into short, accurate prose by having it
  answer in caveman-speak, across six intensity levels including Classical
  Chinese modes. Toggle per chat from the WebUI, with a slash command, or over
  HTTP. Reports the output it actually observed instead of an estimated
  saving, and ships a validated file compressor, 3 subagent profiles, 5
  sub-skills, and 51 unit tests with 15 health-check self-tests.
github: https://github.com/Olszalsik/a0-caveman
tags:
  - prompting
  - llm
