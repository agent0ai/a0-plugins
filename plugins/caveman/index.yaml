title: Caveman (token-compressed replies)
description: >-
  Cuts output tokens by roughly 65% while keeping full technical accuracy by
  having the agent answer in compressed caveman-speak, across six intensity
  levels including Classical Chinese modes. Toggleable per chat from the
  WebUI, with live response validation and cumulative token-savings stats.
