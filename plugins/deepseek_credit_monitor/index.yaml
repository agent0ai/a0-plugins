title: DeepSeek Credit Monitor
description: Displays the current DeepSeek API account balance in the Agent Zero WebUI sidebar. Features multi-currency balance display (USD/CNY), currency-aware low-balance alerts, a details popover, and secure server-side API calls with the key stored in Agent Zero's secret store.
